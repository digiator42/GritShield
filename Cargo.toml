[package]
name = "gritshield"
version = "0.1.0"
edition = "2024"

[dependencies]
colored = "2.1"
regex = "1"
hmac = "0.12.1"
sha2 = "0.10.6"
base64 = "0.21.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
pulldown-cmark = "0.9"
maud = "0.25"
framework_macros = { path = "./src/framework_macros" }
inventory = "0.3"
notify = "4.0"