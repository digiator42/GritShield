[package]
name = "gritshield"
version = "0.1.0"
authors = ["Ahmed Hassan <digiator2020@gmail.com>"]
edition = "2024"
description = "A security-first, high-performance micro-framework."
license = "Apache-2.0"
repository = "https://github.com/digiator42/Gritshield"
readme = "README.md"
keywords = ["web", "framework", "orm", "micro", "async"]
categories = ["web-programming::http-server"]

[dependencies]
colored = "2.1"
regex = "1"
hmac = "0.12.0"
sha2 = "0.10.6"
base64 = "0.21.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
pulldown-cmark = "0.9"
maud = "0.25"
gritshield_macros = { path = "./src/gritshield_macros" }
inventory = "0.3"
notify = "4.0"
sea-orm = { version = "1.0", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
sea-orm-migration = "1.1.20"
dotenvy = "0.15.7"
dashmap = "6.1.0"
hex = "0.4.3"
