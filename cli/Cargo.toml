[package]
name = "gritshield_cli"
version = "0.1.0"
edition = "2021"
authors = ["Ahmed Hassan"]
description = "Command line interface tool for scaffolding secure web engines under the GritShield framework."
license = "Apache-2.0"
repository = "https://github.com/digiator42/gritshield"
readme = "README.md"
keywords = ["cli", "scaffold", "generator", "gritshield", "web"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[[bin]]
name = "gritshield"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
heck = "0.5"
dialoguer = "0.11"
dotenvy = "0.15"
tokio = { version = "1.0", features = ["full"] }
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }