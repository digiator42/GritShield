name: Build and Deploy 3D Site + Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/docs.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the 3D site (website folder → _site root)
      - name: Prepare 3D site
        run: |
          mkdir -p _site
          cp -r website/* _site/
          echo "3D site prepared at _site/"
          ls -la _site/

      # Build mdBook docs
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Build mdBook
        run: |
          cd docs
          mdbook build

      # Move mdBook output under _site/docs
      - name: Integrate docs
        run: |
          mkdir -p _site/docs
          cp -r docs/book/* _site/docs/
          echo "Docs integrated at _site/docs/"
          ls -la _site/

      # Upload artifact
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
