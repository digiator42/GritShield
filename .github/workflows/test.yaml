name: Rust Safety (Tests)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Speeds up workflow by caching dependencies between pushes
      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Verify Builds Cleanly
        run: cargo check

      - name: Run Integration Tests Suite
        run: cargo test --all-targets