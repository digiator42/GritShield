[package]
name = "gritshield_macros"
version = "0.1.1"
edition = "2021"
description = "Procedural attribute routing macros for the GritShield secure web framework."
license = "Apache-2.0"
repository = "https://github.com/digiator42/gritshield"
documentation = "https://docs.rs/gritshield_macros"
readme = "README.md"
keywords = ["macros", "proc-macro", "web", "routing", "security"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
inventory = "0.3"
serde = { version = "1.0", features = ["derive"] }
lazy_static = "1.4"
serde_json = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.0"