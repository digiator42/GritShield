[package]
name = "rbac_caps"
version = "0.1.0"
edition = "2021"
description = "GritShield RBAC and capability guide: roles, inheritance, and compile-time capability tokens."

[dependencies]
# No features at all. Authentication, sessions, RBAC and capabilities are all in
# the core crate, so this example does not need the `mcp` default feature or any
# database driver. Roles live in the session and capabilities are checked in
# process - there is nothing to store.
gritshield = { path = "../../", default-features = false }

tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The route attributes register themselves into an inventory at startup.
ctor = "1.0.7"