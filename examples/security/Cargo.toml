[package]
name = "security"
version = "0.1.0"
edition = "2021"
description = "GritShield security developer guide: XSS, CSRF, sessions, rate limiting and IP blacklisting."

[dependencies]
# The security surface needs no database, no admin panel and no MCP transport,
# so this example opts out of the default feature set entirely. That is also the
# quickest way to prove a service does not accidentally depend on them.
gritshield = { path = "../../", default-features = false }

tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"