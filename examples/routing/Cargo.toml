[package]
name = "routing"
version = "0.1.0"
edition = "2021"
description = "GritShield routing developer guide: controllers, path params, route priority, custom middleware and error handling."

[dependencies]
gritshield = { path = "../../", default-features = false }

tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
# Needed only because `#[gritshield::catch]` expands to a `#[ctor]` registration,
# and the `ctor` attribute resolves against the consuming crate.
ctor = "1.0"