[package]
name = "websocket"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gritshield = { path = "../../", default-features = false }
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
ctor = "1.0"